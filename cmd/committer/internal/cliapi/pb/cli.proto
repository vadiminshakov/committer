syntax = "proto3";
package cliapi;
option go_package = "github.com/vadiminshakov/committer/v2/cmd/committer/internal/cliapi/pb";

// CLI lets the committer CLI write through a coordinator and read a
// cohort's committed data.
service CLI {
  rpc Put(PutRequest) returns (PutResponse);
  rpc Get(GetRequest) returns (GetResponse);
}

message PutRequest {
  string key = 1;
  bytes value = 2;
}

message PutResponse {
  uint64 height = 1;
}

message GetRequest {
  string key = 1;
}

message GetResponse {
  bytes value = 1;
}
