syntax = "proto3";
package schema;
option go_package = "github.com/vadiminshakov/committer/v2/io/gateway/grpc/proto";

service InternalCommitAPI {
  rpc Propose(ProposeRequest) returns (Response);
  rpc Precommit(PrecommitRequest) returns (Response);
  rpc Commit(CommitRequest) returns (Response);
  rpc Abort(AbortRequest) returns (Response);
  // Decision lets an in-doubt cohort ask the coordinator for the recorded
  // outcome of a given height (2PC termination protocol).
  rpc Decision(DecisionRequest) returns (DecisionResponse);
}

message ProposeRequest {
  string Key = 1;
  bytes Value = 2;
  CommitType CommitType = 3;
  uint64 index = 4;
}

enum CommitType {
  TWO_PHASE_COMMIT = 0;
  THREE_PHASE_COMMIT = 1;
}

enum Type {
  ACK = 0;
  NACK = 1;
}

message Response {
  Type type = 1;
  uint64 index = 2;
  // reason explains a NACK, e.g. why a participant's resource rejected a proposal.
  string reason = 3;
}

message PrecommitRequest {
  uint64 index = 1;
}

message CommitRequest {
  uint64 index = 1;
  bool isRollback = 2;
}

message AbortRequest {
  uint64 height = 1;
  string reason = 2;
}

message DecisionRequest {
  uint64 height = 1;
}

enum Outcome {
  OUTCOME_UNKNOWN = 0;
  OUTCOME_COMMIT = 1;
  OUTCOME_ABORT = 2;
}

message DecisionResponse {
  Outcome outcome = 1;
}